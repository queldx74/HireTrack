{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireTrack — Log in</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="device">
  <div class="ht-topbar">
    <a href="{% url 'home' %}" class="ht-back"><i class="bi bi-arrow-left"></i></a>
    <h1>Log in</h1>
    <span style="width:36px;"></span>
  </div>

  <div class="ht-auth-wrap">
    <div class="ht-logo-mark">HT</div>
    <h1 class="ht-h1 mb-1">Welcome back</h1>
    <p class="ht-body mb-4" style="color: var(--ht-muted);">Log in to pick up where you left off.</p>

    <form method="post" novalidate>
      {% csrf_token %}

      {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
      {% endif %}

      <div class="ht-field">
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </div>

      <div class="ht-field">
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </div>

      <button type="submit" class="btn btn-ht-primary w-100">Log in</button>
    </form>

    <div class="ht-divider">or</div>

    <p class="text-center ht-body mb-0" style="color: var(--ht-muted);">
      Don't have an account? <a href="{% url 'register' %}" style="color: var(--ht-primary); font-weight:600; text-decoration:none;">Create one</a>
    </p>
  </div>
</div>

</body>
</html>
