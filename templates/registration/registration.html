<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireTrack — Create account</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen-label">📝 Registration</div>

  <div class="ht-topbar">
    <a href="index.html" class="ht-back"><i class="bi bi-arrow-left"></i></a>
    <h1>Create account</h1>
    <span style="width:36px;"></span>
  </div>

  <div class="ht-auth-wrap">
    <div class="ht-logo-mark">HT</div>
    <h1 class="ht-h1 mb-1">Let's get you set up</h1>
    <p class="ht-body mb-4" style="color: var(--ht-muted);">It takes less than a minute.</p>

    <form>
      <div class="ht-field">
        <label for="reg-name">Full name</label>
        <input type="text" class="form-control" id="reg-name" placeholder="Jordan Smith">
      </div>

      <div class="ht-field">
        <label for="reg-email">Email address</label>
        <input type="email" class="form-control" id="reg-email" placeholder="jordan@email.com">
      </div>

      <div class="ht-field">
        <label for="reg-password">Password</label>
        <input type="password" class="form-control" id="reg-password" placeholder="At least 8 characters">
        <div class="form-text">Use 8+ characters with a mix of letters and numbers.</div>
      </div>

      <div class="ht-field mb-4">
        <label for="reg-confirm">Confirm password</label>
        <input type="password" class="form-control" id="reg-confirm" placeholder="Re-enter your password">
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="reg-terms">
        <label class="form-check-label ht-body" for="reg-terms" style="color: var(--ht-muted); font-size:0.8125rem;">
          I agree to the Terms of Service and Privacy Policy
        </label>
      </div>

      <button type="button" class="btn btn-ht-primary w-100">Create account</button>
    </form>

    <div class="ht-divider">or</div>

    <p class="text-center ht-body mb-0" style="color: var(--ht-muted);">
      Already have an account? <a href="login.html" style="color: var(--ht-primary); font-weight:600; text-decoration:none;">Log in</a>
    </p>
  </div>
</div>

</body>
</html>
