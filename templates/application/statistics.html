{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireTrack — Statistics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="device">

  <div class="ht-topbar">
    <a href="{% url 'dashboard' %}" class="ht-back" aria-label="Back to dashboard"><i class="bi bi-arrow-left"></i></a>
    <h1>Statistics</h1>
    <span style="width:36px;"></span>
  </div>

  <div class="ht-content">

    <div class="stat-card mb-3">
      <div class="stat-icon total"><i class="bi bi-collection"></i></div>
      <div>
        <div class="ht-stat-value total">{{ total }}</div>
        <div class="ht-label mb-0">Total applications</div>
      </div>
    </div>

    <h2 style="font-size:1rem;" class="mb-2">By status</h2>

    <div class="ht-card">
      {% for status in status_counts %}
        <div class="d-flex justify-content-between align-items-center py-2"
             style="{% if not forloop.last %}border-bottom:1px solid var(--ht-line);{% endif %}">
          <span class="status-{{ status.code }}"
                style="display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:0.75rem; padding:5px 12px; border-radius:999px; border:1px solid transparent;">
            <span class="dot"></span>{{ status.label }}
          </span>
          <span class="ht-stat-value" style="font-size:1.125rem;">{{ status.count }}</span>
        </div>
      {% endfor %}
    </div>

  </div>

  <nav class="ht-bottomnav">
    <a href="{% url 'dashboard' %}" class="nav-item-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
    <a href="{% url 'add_application' %}" class="nav-item-link"><i class="bi bi-plus-circle"></i>Add</a>
    <a href="{% url 'statistics' %}" class="nav-item-link active"><i class="bi bi-bar-chart"></i>Stats</a>
    <a href="#" class="nav-item-link"><i class="bi bi-person"></i>Profile</a>
  </nav>
</div>

</body>
</html>
