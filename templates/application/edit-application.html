<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireTrack — Edit application</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen-label">✏️ Edit application</div>

  <div class="ht-topbar">
    <a href="application-details.html" class="ht-back"><i class="bi bi-x-lg"></i></a>
    <h1>Edit application</h1>
    <span style="width:36px;"></span>
  </div>

  <div class="ht-content">
    <form>
      <div class="ht-field">
        <label for="edit-company">Company</label>
        <input type="text" class="form-control" id="edit-company" value="Nova Studio">
      </div>

      <div class="ht-field">
        <label for="edit-role">Job title</label>
        <input type="text" class="form-control" id="edit-role" value="Product Designer">
      </div>

      <div class="ht-field">
        <label for="edit-status">Status</label>
        <select class="form-select" id="edit-status">
          <option>Saved</option>
          <option>Applied</option>
          <option selected>Interview</option>
          <option>Offer</option>
          <option>Rejected</option>
        </select>
      </div>

      <div class="ht-field">
        <label for="edit-date">Date applied</label>
        <input type="date" class="form-control" id="edit-date" value="2026-09-01">
      </div>

      <div class="ht-field">
        <label for="edit-link">Job posting link</label>
        <input type="url" class="form-control" id="edit-link" value="https://novastudio.com/careers/product-designer">
      </div>

      <div class="ht-field">
        <label for="edit-location">Location</label>
        <input type="text" class="form-control" id="edit-location" value="Remote — UK">
      </div>

      <div class="ht-field mb-4">
        <label for="edit-notes">Notes</label>
        <textarea class="form-control" id="edit-notes" rows="4">First interview with the hiring manager went well. Second round with the design team scheduled for next week.</textarea>
      </div>
    </form>
  </div>

  <div style="position:sticky; bottom:0; background:#fff; border-top:1px solid var(--ht-line); padding:14px 20px 20px; display:flex; gap:12px;">
    <a href="application-details.html" class="btn btn-ht-secondary flex-fill text-center">Cancel</a>
    <a href="application-details.html" class="btn btn-ht-primary flex-fill text-center">Save changes</a>
  </div>
</div>

</body>
</html>
