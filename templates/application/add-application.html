{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireTrack — Add application</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
#<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="device">
  <div class="screen-label">➕ Add application</div>

  <div class="ht-topbar">
    <a href="dashboard.html" class="ht-back"><i class="bi bi-x-lg"></i></a>
    <h1>Add application</h1>
    <span style="width:36px;"></span>
  </div>

  <div class="ht-content">
    <form>
      <div class="ht-field">
        <label for="add-company">Company</label>
        <input type="text" class="form-control" id="add-company" placeholder="e.g. Nova Studio">
      </div>

      <div class="ht-field">
        <label for="add-role">Job title</label>
        <input type="text" class="form-control" id="add-role" placeholder="e.g. Product Designer">
      </div>

      <div class="ht-field">
        <label for="add-status">Status</label>
        <select class="form-select" id="add-status">
          <option>Saved</option>
          <option>Applied</option>
          <option>Interview</option>
          <option>Offer</option>
          <option>Rejected</option>
        </select>
      </div>

      <div class="ht-field">
        <label for="add-date">Date applied</label>
        <input type="date" class="form-control" id="add-date">
      </div>

      <div class="ht-field">
        <label for="add-link">Job posting link</label>
        <input type="url" class="form-control" id="add-link" placeholder="https://">
      </div>

      <div class="ht-field">
        <label for="add-location">Location</label>
        <input type="text" class="form-control" id="add-location" placeholder="e.g. Remote, Edinburgh">
      </div>

      <div class="ht-field mb-4">
        <label for="add-notes">Notes</label>
        <textarea class="form-control" id="add-notes" rows="4" placeholder="Contacts, interview prep, follow-up reminders…"></textarea>
      </div>
    </form>
  </div>

  <div style="position:sticky; bottom:0; background:#fff; border-top:1px solid var(--ht-line); padding:14px 20px 20px; display:flex; gap:12px;">
    <a href="dashboard.html" class="btn btn-ht-secondary flex-fill text-center">Cancel</a>
    <a href="dashboard.html" class="btn btn-ht-primary flex-fill text-center">Save application</a>
  </div>
</div>

</body>
</html>
